aid: molagri
name: Molagri
description: >-
  Molagri is a Toronto-based biotechnology startup building next-generation
  biopesticides for agriculture. The company designs pest-control molecules that
  target specific molecular pathways unique to pest insects while preserving
  pollinators and other beneficial organisms, and uses predictive modeling to
  stay ahead of the evolution of pest resistance. Molagri emphasizes higher
  efficacy and biobased production to reduce emissions across both manufacturing
  and field application. Founded in 2026 by University of Toronto PhD
  biochemists Zaky Hassan and Min Jin, the company was part of the Y Combinator
  Summer 2026 batch. It was surfaced as a Y Combinator portfolio company and
  added to the API Evangelist network for tracking; as an early-stage biotech it
  currently publishes no public developer API surface.
